<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sitzplaner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Sitzplaner</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#fff; --line:#d9dce1; --text:#1f2328; --muted:#667085;
    --accent:#2f6fde; --accent-soft:#e8f0fd; --danger:#c62f2f; --ok:#1d7a46; --warn:#a15c00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  /* Dunkler Hintergrund hinter der Statusleiste und dem Home-Balken des iPads */
  body{font-family:"Segoe UI",Calibri,Arial,sans-serif;color:var(--text);background:#1f2a3a;font-size:15px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;color:var(--text)}
  button:hover{background:#f0f2f5}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(.95)}
  button.danger{color:var(--danger)}
  button.small{padding:3px 8px;font-size:13px}
  button:disabled{opacity:.45;cursor:default}
  input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;color:var(--text)}
  textarea{width:100%;min-height:110px;resize:vertical}
  label.f{display:inline-flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
  label.f input,label.f select{font-size:14px;color:var(--text)}
  h1{font-size:24px;margin:0}
  h2{font-size:17px;margin:0 0 12px}
  h3{font-size:15px;margin:0 0 8px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* Auf dem iPad (als App) oben und unten die Bereiche für Statusleiste und Home-Balken freihalten */
  #app{display:flex;height:100vh;height:100dvh;background:var(--bg);background-clip:content-box;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  #sidebar{width:250px;flex:none;background:#1f2a3a;color:#e7ebf2;display:flex;flex-direction:column}
  #sidebar .brand{padding:16px 16px 10px;font-size:19px;font-weight:600}
  #sidebar .brand small{display:block;font-size:12px;font-weight:400;color:#9fb0c8}
  #sidebar .sec{padding:6px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#9fb0c8}
  #klassenliste{flex:1;overflow:auto;padding:0 8px}
  .kl{display:block;width:100%;text-align:left;background:transparent;border:0;color:#e7ebf2;padding:8px 10px;border-radius:7px;margin:1px 0}
  .kl:hover{background:#2c3a50}
  .kl.active{background:#3b5480}
  .kl small{color:#9fb0c8;margin-left:4px}
  .newk{padding:8px 16px;display:flex;gap:6px}
  .newk input{flex:1;min-width:0;background:#2c3a50;border-color:#3d4d66;color:#fff}
  .newk input::placeholder{color:#9fb0c8}
  .newk button{background:#3b5480;border-color:#3b5480;color:#fff}
  .speicher{border-top:1px solid #33435c;padding:12px 16px;font-size:13px}
  .speicher .st{margin-bottom:8px;line-height:1.35}
  .speicher .st.ok{color:#8fe0b0}
  .speicher .st.warn{color:#ffcf7a}
  .speicher button{width:100%;margin-top:5px;background:#2c3a50;border-color:#3d4d66;color:#e7ebf2;font-size:13px}
  .speicher button.hl{background:#d98b00;border-color:#d98b00;color:#1f2a3a;font-weight:600}

  #main{flex:1;overflow:auto}
  .page{padding:24px 28px;max-width:1250px}
  .head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .head .actions{margin-left:auto;display:flex;gap:8px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media (max-width:1050px){.cols{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .planitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px}
  .planitem .t{font-weight:600}
  .planitem .m{font-size:13px;color:var(--muted)}
  .planitem .b{margin-left:auto;display:flex;gap:6px}
  .stulist{list-style:none;margin:10px 0 0;padding:0;columns:2;column-gap:18px}
  .stulist li{display:flex;align-items:center;gap:6px;padding:4px 2px;border-bottom:1px solid #eef0f3;break-inside:avoid}
  .stulist li span{flex:1}
  .stulist li button{border:0;background:transparent;padding:2px 5px;color:var(--muted)}
  .stulist li button:hover{color:var(--text);background:#eef0f3}
  .stulist li button.x:hover{color:var(--danger)}
  details{margin-top:10px}
  summary{cursor:pointer;color:var(--accent)}
  .hint{font-size:13px;color:var(--muted);line-height:1.45}
  .welcome{max-width:760px}
  .welcome ol{line-height:1.7}

  /* Sitzplan-Ansicht */
  .toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .toolbar .grp{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
  .toolbar .sep{width:1px;align-self:stretch;background:var(--line)}
  .planbody{display:flex;gap:18px;padding:18px;align-items:flex-start}
  .sheetwrap{flex:1;min-width:0;background:#e6e8ec;border-radius:10px;padding:16px;overflow:hidden}
  .pool{width:250px;flex:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
  .pool.over{outline:3px dashed var(--accent);outline-offset:-3px}
  .chip{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;margin-bottom:5px;cursor:grab;color:var(--text)}
  .chip:hover{border-color:var(--accent)}
  .chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .addpool{display:flex;gap:5px;margin-top:10px}
  .addpool input{flex:1;min-width:0}

  /* Das Blatt (wie die Word-Vorlage, DIN A4 quer) */
  .sheet{background:#fff;width:277mm;padding:6mm 0 4mm;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.12);font-family:Calibri,"Segoe UI",Arial,sans-serif;color:#000}
  .sheet .titel{font-size:18pt;font-weight:700;text-align:center}
  .sheet .meta{font-size:12pt;text-align:center;margin:1.5mm 0 4mm;white-space:pre}
  .sheet .meta b{font-weight:400;text-decoration:underline;text-underline-offset:2px}
  .sheet .grid{display:grid;margin:0 auto;justify-content:center}
  .seat{display:flex;align-items:center;justify-content:center;text-align:center;padding:1mm 1.5mm;overflow:hidden;position:relative;cursor:pointer;background:#fff}
  .seat .nm{display:block;font-size:16pt;line-height:1.1;overflow-wrap:normal;word-break:normal}
  .seat:hover{background:#f2f6fe}
  .seat.sel{background:#cfe0fb}
  .seat.over{background:#dbe8fd}
  .seat.frei.ziel{background:#f5f9ff}
  .seat .clr{position:absolute;top:1px;right:2px;border:0;background:transparent;font-size:12px;line-height:1;padding:2px 4px;color:#999;display:none}
  .seat:hover .clr{display:block}
  .seat .clr:hover{color:var(--danger);background:transparent}
  .pult{border:2.25pt solid #000;width:55mm;height:10mm;margin:5mm auto 0;display:flex;align-items:center;justify-content:center;font-size:14pt;font-weight:700;letter-spacing:.1em}
  .pult.oben{margin:0 auto 5mm}

  /* Freie Anordnung */
  .flaeche{position:relative;margin:0 auto}
  .flaeche.edit{outline:1px dashed #9aa6ba;outline-offset:2px;
    background-image:radial-gradient(#d5dbe5 0.5px, transparent 0.6px);background-size:5mm 5mm}
  .tisch{position:absolute;display:flex}
  .tisch .seat{flex:none}
  .flaeche.edit .tisch, .flaeche.edit .pult{cursor:move;touch-action:none;user-select:none}
  .flaeche.edit .seat{cursor:move}
  .flaeche.edit .seat:hover{background:#fff}
  .flaeche.edit .seat .clr{display:none !important}
  .tsel{outline:3px solid var(--accent);outline-offset:2px;z-index:2}
  .tsel .seat{background:#eef4fe !important}
  .pult.frei{position:absolute;margin:0;background:#fff}
  .leerhinweis{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a94a6;font-size:14pt;pointer-events:none}
  .modus{background:#eef0f3;border-radius:9px;padding:3px;gap:3px}
  .modus button{border:0;background:transparent}
  .modus button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
  .pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pal-grid button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;font-size:13px}
  .ico{display:block;border:2px solid #333;height:10px;background:repeating-linear-gradient(90deg,#fff 0 13px,#333 13px 14px)}
  .ico.i1{width:14px}.ico.i2{width:28px}.ico.i3{width:42px}
  .ico.g4{width:28px;height:20px;background:repeating-linear-gradient(90deg,transparent 0 13px,#333 13px 14px),linear-gradient(#fff 0 9px,#333 9px 11px,#fff 11px)}
  .ico.g6{width:42px;height:20px;background:repeating-linear-gradient(90deg,transparent 0 13px,#333 13px 14px),linear-gradient(#fff 0 9px,#333 9px 11px,#fff 11px)}

  /* Klassenliste einlesen */
  .modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:14px;width:min(1050px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal-h h2{margin:0}
  .modal-h .x{margin-left:auto;border:0;font-size:18px}
  .modal-b{padding:16px 18px;overflow:auto;flex:1}
  .modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .drop{border:2px dashed #c5cad3;border-radius:12px;padding:34px 20px;text-align:center;color:var(--muted);line-height:1.6}
  .drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .drop .big{font-size:40px}
  .imp-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .imp-grid.ohne{grid-template-columns:1fr}
  .imp-vorschau{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#f7f7f7;position:sticky;top:0}
  .imp-vorschau img{width:100%;display:block}
  .imp-zeile{display:flex;gap:6px;align-items:center;margin-bottom:4px}
  .imp-zeile input[type=text]{flex:1;padding:4px 8px}
  .imp-zeile.aus input[type=text]{color:#9aa1ad;text-decoration:line-through}
  .imp-zeile .tag{font-size:11px;color:var(--warn);white-space:nowrap}
  .imp-zeile button{border:0;padding:2px 6px;color:var(--muted)}
  .imp-hinweis{background:#fff7e6;border:1px solid #f3d9a4;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
  .imp-fehler{background:#fdecec;border:1px solid #f1b8b8;border-radius:8px;padding:10px 12px;margin-top:12px;color:#8a1f1f}
  .progress{height:8px;background:#eef0f3;border-radius:5px;overflow:hidden;margin:10px 0 14px}
  .progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2a3a;color:#fff;padding:9px 16px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  .toast.on{opacity:1}

  /* ---------- Schlichte Bedienelemente ---------- */
  .abstand{flex:1}
  button.flach{border-color:transparent;background:transparent}
  button.flach:hover{background:#eef0f3}
  button.klein{font-size:13px;padding:4px 8px;color:var(--accent)}
  button.klein.an{background:var(--accent-soft)}
  .hint.leise{font-size:12px;color:#8a93a3;margin-top:12px}
  .zahl{color:#8a93a3;font-weight:400;margin-left:4px}
  .toolbar.leiste{align-items:center;gap:6px;padding:8px 14px;flex-wrap:wrap}
  .titelfeld{font-size:17px;font-weight:600;border-color:transparent;background:transparent;width:220px;min-width:100px;padding:5px 8px}
  .titelfeld:hover{border-color:var(--line)}
  .titelfeld:focus{border-color:var(--accent);background:#fff;outline:none}
  .leise-feld{border-color:transparent;background:transparent;color:var(--muted)}
  .leise-feld:hover,.leise-feld:focus{border-color:var(--line);background:#fff}
  .speicherstand{font-size:12px;color:var(--ok);white-space:nowrap}
  .modus{display:flex;background:#eef0f3;border-radius:9px;padding:3px;gap:3px}
  details.mehr{position:relative}
  details.mehr>summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:5px 12px;background:#fff;font-weight:700;letter-spacing:1px;user-select:none}
  details.mehr>summary::-webkit-details-marker{display:none}
  details.mehr[open]>summary{background:#eef0f3}
  .mehr-menue{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;min-width:250px;z-index:25;display:flex;flex-direction:column;gap:2px}
  .mehr-menue button{text-align:left;border:0;background:transparent;width:100%;padding:8px 10px}
  .mehr-menue button:hover{background:#f0f2f5}
  .mehr-menue label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:4px 10px}
  .mehr-menue .trenner{height:1px;background:var(--line);margin:5px 4px}
  details.neuplan{margin-top:14px}
  details.neuplan>summary{list-style:none;display:inline-block;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0}
  details.neuplan>summary::-webkit-details-marker{display:none}
  details.klein{margin-top:10px;font-size:13px}
  details.klein>summary{color:var(--accent)}
  details.inline{margin-top:0}
  .planitem{cursor:pointer}
  .planitem:hover{border-color:var(--accent)}
  ol.schritte{line-height:1.9;padding-left:20px;margin:16px 0 8px}
  .speicher details.sich{margin-top:8px}
  .speicher details.sich>summary{color:#9fb0c8;cursor:pointer;font-size:12px}
  .speicher .st{margin-bottom:4px}

  /* Blatt passend verkleinern (per transform, funktioniert auch auf dem iPad) */
  .sheetsizer{margin:0 auto;position:relative}
  .sheetsizer .sheet{margin:0;transform-origin:0 0;position:absolute;left:0;top:0}

  /* Ziehen mit Maus oder Finger */
  .chip,.seat{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .chip{touch-action:pan-y}
  .planbody .seat:not(.frei){touch-action:none}
  .geist{position:fixed;z-index:60;pointer-events:none;background:var(--accent);color:#fff;padding:8px 13px;border-radius:9px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translate(-50%,-130%);font-size:15px;white-space:nowrap}
  body.zieht, body.zieht *{cursor:grabbing !important}
  .platzwahl{background:var(--accent-soft);border:1px solid #bcd0f5;border-radius:10px;padding:10px;margin-bottom:12px}
  .platzwahl b{display:block;margin-bottom:6px}
  .pal-pfeile{display:grid;grid-template-columns:repeat(3,40px);gap:4px;justify-content:center;margin-top:8px}
  .pal-pfeile button{padding:6px 0}
  button.an{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Menü-Knopf und Hintergrund für schmale Bildschirme (iPad hochkant) */
  .menuknopf{display:none}
  #schleier{display:none}
  @media (max-width:1100px){
    #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.3);
      padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    body.menu-offen #sidebar{transform:none}
    body.menu-offen #schleier{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:29}
    .menuknopf{display:inline-flex;align-items:center;gap:6px}
    .page{padding:16px}
  }
  /* In der Sitzplan-Ansicht braucht das Blatt den Platz: Seitenleiste schon früher einklappen */
  @media (max-width:1400px){
    body.planansicht #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.3);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    body.planansicht.menu-offen #sidebar{transform:none}
    body.planansicht.menu-offen #schleier{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:29}
    body.planansicht .menuknopf{display:inline-flex;align-items:center}
  }
  @media (max-width:900px){
    .planbody{flex-direction:column;padding:12px}
    .sheetwrap{width:100%}
    .pool{width:100%;position:static;max-height:none}
    .pool .chips{display:flex;flex-wrap:wrap;gap:6px}
    .pool .chip{width:auto;margin:0}
    .stulist{columns:1}
    .toolbar{padding:8px 12px;position:static}
    .pal-grid{grid-template-columns:repeat(5,1fr)}
    .titelfeld{width:150px}
    .speicherstand{display:none}
  }
  /* Finger statt Maus: größere Knöpfe, keine Vergrößerung beim Tippen in Felder */
  @media (pointer:coarse){
    button{padding:9px 14px}
    button.small{padding:7px 11px}
    input,select,textarea{font-size:16px;padding:9px 11px}
    label.f input,label.f select{font-size:16px}
    .chip{padding:11px 13px}
    .kl{padding:12px}
    .stulist li button{padding:8px 11px}
    .seat .clr{display:none !important}
  }
  /* Ausgeklappte Seitenleiste und Hinweise ebenfalls nicht unter Statusleiste/Home-Balken */
  .toast{bottom:calc(18px + env(safe-area-inset-bottom))}
  .modal-bg{padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}

  @media print{
    @page{size:A4 landscape;margin:8mm 10mm}
    body{background:#fff}
    #sidebar,.toolbar,.pool,.toast,.noprint,.menuknopf,#schleier{display:none !important}
    #app{display:block;height:auto;padding:0 !important;background:#fff}
    #main{overflow:visible}
    .planbody{padding:0;display:block}
    .sheetwrap{background:none;padding:0;border-radius:0}
    .sheetsizer{width:auto !important;height:auto !important}
    .sheetsizer .sheet{position:static}
    .sheet{transform:none !important;box-shadow:none;margin:0 auto;padding-top:0}
    .seat .clr{display:none !important}
    .seat,.seat.sel,.seat:hover{background:#fff !important}
    .flaeche.edit{outline:none;background:none}
    .tsel{outline:none}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">Sitzplaner <small>Realschule Steinhagen</small></div>
    <div class="sec">Klassen</div>
    <div id="klassenliste"></div>
    <form class="newk" id="newk">
      <input id="newkName" placeholder="Neue Klasse, z. B. 7d" autocomplete="off">
      <button type="submit" title="Klasse anlegen">+</button>
    </form>
    <div class="speicher" id="speicher"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="schleier" data-a="menu-zu"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="impFile" accept="image/*,.heic,.heif,.pdf,.docx,.xlsx,.csv,.tsv,.txt" hidden>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   Sitzplaner – alles in einer Datei.
   Daten: im Browser (localStorage) + auf Wunsch automatisch in
   einer Speicherdatei (sitzplaene-daten.json) auf der Festplatte.
   ============================================================ */

const LS_KEY = "sitzplaner-daten-v1";
const LS_VIEW = "sitzplaner-ansicht-v1";
const TW = 0.0176389; // 1 Twip (Word-Maß) in mm

/* ---------- Die beiden Raum-Vorlagen (aus den Word-Dateien übernommen) ---------- */
function bauKlassenraum(){
  // 4 Reihen, je 2 Zweiertische links, Gang, 2 Zweiertische rechts
  const cols = [1800,1800,1800,1800,1300,1800,1800,1800,1800];
  const rows = [], seats = [];
  for(let i=0;i<4;i++){
    rows.push(1600); if(i<3) rows.push(450);
    const r = i*2;
    [[0,1],[2,3],[5,6],[7,8]].forEach(([a,b])=>{
      seats.push({id:`k${i}-${a}`,row:r,col:a,bd:{t:"S",l:"S",b:"S",r:"d"}});
      seats.push({id:`k${i}-${b}`,row:r,col:b,bd:{t:"S",l:"n",b:"S",r:"S"}});
    });
  }
  return {name:"Reihen", titel:"Sitzplan", mitRaum:true, cols, rows, seats};
}
function bauPhysikraum(){
  // 4 Blöcke: Wandplätze links/rechts (übereinander), in der Mitte zwei Zweiertische
  const cols = [1950,220,1950,1950,1500,1950,1950,220,1950];
  const rows = [], seats = [];
  for(let b=0;b<4;b++){
    rows.push(880,880); if(b<3) rows.push(300);
    const A = b*3, B = b*3+1;
    [0,8].forEach(c=>{
      seats.push({id:`p${b}-${c}a`,row:A,col:c,bd:{t:"S",l:"S",b:"d",r:"S"}});
      seats.push({id:`p${b}-${c}b`,row:B,col:c,bd:{t:"n",l:"S",b:"S",r:"S"}});
    });
    [[2,3],[5,6]].forEach(([x,y])=>{
      seats.push({id:`p${b}-${x}`,row:B,col:x,bd:{t:"S",l:"S",b:"S",r:"d"}});
      seats.push({id:`p${b}-${y}`,row:B,col:y,bd:{t:"S",l:"n",b:"S",r:"S"}});
    });
  }
  return {name:"U-Form", titel:"Sitzplan Physikraum", mitRaum:false, cols, rows, seats};
}
const LAYOUTS = {klassenraum: bauKlassenraum(), physikraum: bauPhysikraum()};
for(const L of Object.values(LAYOUTS)){
  L.seats.sort((a,b)=>a.row-b.row||a.col-b.col);
}

/* ---------- Freie Anordnung: Tische selbst schieben ---------- */
const FL_W = 277, FL_H = 165;     // Fläche in mm (passt auf DIN A4 quer)
const SW = 30, SH = 18;           // ein Platz: 30 mm breit, 18 mm hoch
const PULT_W = 55, PULT_H = 10;
const tid = () => "t" + Math.random().toString(36).slice(2,9);
const pultStart = () => ({x:(FL_W-PULT_W)/2, y:FL_H-PULT_H-2});
const platzB = t => t.b || SW;     // Platzbreite (bei „3 Reihen“ schmaler, damit 10 Plätze nebeneinander passen)
const tischGroesse = t => t.richtung==="laengs" ? [platzB(t), t.n*SH] : [t.n*platzB(t), SH];
const sitzId = (t,i) => `${t.id}-${i}`;

// Aus einer festen Vorlage Tische machen (Zweiertische bleiben zusammen)
function vorlageZuTischen(typ){
  const L = LAYOUTS[typ];
  const x0 = c => L.cols.slice(0,c).reduce((a,b)=>a+b,0)*TW;
  const y0 = r => L.rows.slice(0,r).reduce((a,b)=>a+b,0)*TW;
  const breite = L.cols.reduce((a,b)=>a+b,0)*TW, versatz = (FL_W-breite)/2;
  const tische = [], map = {}, belegt = new Set();
  const finde = (r,c) => L.seats.find(s=>s.row===r && s.col===c);
  for(const s of L.seats){
    if(belegt.has(s.id)) continue;
    let partner = null, richtung = "quer";
    if(s.bd.r==="d") partner = finde(s.row, s.col+1);
    else if(s.bd.b==="d"){ partner = finde(s.row+1, s.col); richtung = "laengs"; }
    const t = {id:tid(), x:+(x0(s.col)+versatz).toFixed(1), y:+y0(s.row).toFixed(1), n:partner?2:1, richtung};
    tische.push(t);
    map[s.id] = sitzId(t,0); belegt.add(s.id);
    if(partner){ map[partner.id] = sitzId(t,1); belegt.add(partner.id); }
  }
  return {tische, map};
}
function gruppenStart(){
  // 8 Gruppentische zu je 4 Plätzen (2 Zweiertische gegenüber), 4 nebeneinander, 2 Reihen
  const tische = [], gw = 2*SW, gh = 2*SH, sp = 4;
  const lx = (FL_W - sp*gw) / (sp+1);
  for(let r=0;r<2;r++) for(let c=0;c<sp;c++){
    const x = +(lx + c*(gw+lx)).toFixed(1), y = 18 + r*(gh+38);
    tische.push({id:tid(), x, y, n:2, richtung:"quer"}, {id:tid(), x, y:y+SH, n:2, richtung:"quer"});
  }
  return tische;
}
function dreiReihenStart(){
  // 3 Reihen zu je 10 Plätzen: links 2 Zweiertische aneinander, Mitte 2 aneinander, rechts 1 Zweiertisch
  const b = 23.5, rand = 5, gang = (FL_W - 2*rand - 10*b) / 2;
  const tische = [];
  for(let r=0;r<3;r++){
    const y = 14 + r*(SH+30);
    let x = rand;
    for(const block of [2,2,1]){
      for(let i=0;i<block;i++){ tische.push({id:tid(), x:+x.toFixed(1), y, n:2, b, richtung:"quer"}); x += 2*b; }
      x += gang;
    }
  }
  return tische;
}
function startTische(art){
  if(art==="dreireihen") return dreiReihenStart();
  if(art==="reihen") return vorlageZuTischen("klassenraum").tische;
  if(art==="physik") return vorlageZuTischen("physikraum").tische;
  if(art==="gruppen") return gruppenStart();
  return [];
}

// Infos zu einem Plan, egal ob Vorlage oder frei
const istFrei = p => p.typ==="frei";
const planArt = p => istFrei(p) ? "Offen" : LAYOUTS[p.typ].name;
const mitRaum = p => istFrei(p) || LAYOUTS[p.typ].mitRaum;
function planPlaetze(p){
  if(!istFrei(p)) return LAYOUTS[p.typ].seats.map(s=>s.id);
  return p.tische.flatMap(t=>Array.from({length:t.n},(_,i)=>sitzId(t,i)));
}
// Plätze von vorne (am Pult) nach hinten, in „Bändern“, damit innerhalb eines Bands gemischt werden kann
function plaetzeVonVorne(p){
  if(!istFrei(p)){
    const reihen = {};
    LAYOUTS[p.typ].seats.forEach(s=>(reihen[s.row] ||= []).push(s.id));
    return Object.keys(reihen).map(Number).sort((a,b)=>b-a).map(r=>reihen[r]);
  }
  const px = p.pult.x+PULT_W/2, py = p.pult.y+PULT_H/2, baender = {};
  for(const t of p.tische) for(let i=0;i<t.n;i++){
    const B = platzB(t);
    const cx = t.richtung==="laengs" ? t.x+B/2 : t.x+i*B+B/2;
    const cy = t.richtung==="laengs" ? t.y+i*SH+SH/2 : t.y+SH/2;
    const b = Math.floor(Math.hypot(cx-px, cy-py)/35);
    (baender[b] ||= []).push(sitzId(t,i));
  }
  return Object.keys(baender).map(Number).sort((a,b)=>a-b).map(b=>baender[b]);
}

const datum = iso => iso ? new Date(iso).toLocaleDateString("de-DE") : "";
const nachname = n => { const p = n.trim().split(/\s+/); return p[p.length-1]; };
const vorname = n => { const p = n.trim().split(/\s+/); return p.length>1 ? p.slice(0,-1).join(" ") : p[0]; };

  nachname(a.name).localeCompare(nachname(b.name),"de") || a.name.localeCompare(b.name,"de"));

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),2600); }

/* ---------- Daten ---------- */
function leer(){ return {version:1, gespeichert:null, klassen:[]}; }
function pruefe(d){
  if(!d || !Array.isArray(d.klassen)) throw new Error("Das ist keine Sitzplaner-Datei.");
  for(const k of d.klassen){
    k.id ||= uid(); k.name ||= "Klasse"; k.schuljahr ??= ""; k.schueler ||= []; k.plaene ||= [];
    const ids = new Set(k.schueler.map(s=>s.id));
    for(const p of k.plaene){
      p.id ||= uid(); p.typ = (LAYOUTS[p.typ] || p.typ==="frei") ? p.typ : "klassenraum"; p.sitze ||= {};
      if(istFrei(p)){
        p.tische = Array.isArray(p.tische) ? p.tische.filter(t=>t && t.id && t.n>0) : [];
        p.tische.forEach(t=>{ t.x=+t.x||0; t.y=+t.y||0; t.n=Math.min(6,Math.max(1,+t.n||1)); t.richtung = t.richtung==="laengs"?"laengs":"quer";
          if(t.b!==undefined){ t.b = +t.b; if(!(t.b>=15 && t.b<=40)) delete t.b; } });
        p.pult ||= pultStart(); p.pultOben = false;
      }
      p.anzeige ||= "voll"; p.pultOben = !!p.pultOben; p.raum ??= ""; p.titel ||= planArt(p);
      const plaetze = new Set(planPlaetze(p));
      for(const [seat,sid] of Object.entries(p.sitze)) if(!ids.has(sid) || !plaetze.has(seat)) delete p.sitze[seat];
    }
  }
  return d;
}
function ladeLokal(){
  try{ const t=localStorage.getItem(LS_KEY); return t ? pruefe(JSON.parse(t)) : leer(); }
  catch(e){ console.error(e); return leer(); }
}

let selTische = new Set();     // ausgewählte Tische (und ggf. "PULT")

function aendern(fn, opts={}){

// Mehrere Fenster/Tabs gleichzeitig offen: immer den neuesten Stand übernehmen,
// damit ein älteres Fenster nicht die Änderungen aus einem anderen Fenster überschreibt.
function neuesterStandUebernehmen(roh){
  try{
    if(!roh) return false;
    const d = pruefe(JSON.parse(roh));
    if(!d.gespeichert || (S.gespeichert && d.gespeichert <= S.gespeichert)) return false;
    S = d; sel = null; selTische = new Set(); undo = [];
    render();
    return true;
  }catch(e){ console.warn(e); return false; }
}
window.addEventListener("storage", e=>{
  if(e.key===LS_KEY && neuesterStandUebernehmen(e.newValue)) toast("In einem anderen Fenster wurde etwas geändert – hier ist jetzt der neueste Stand.");
});
const standPruefen = ()=>{ if(neuesterStandUebernehmen(localStorage.getItem(LS_KEY))) toast("Neuester Stand aus einem anderen Fenster übernommen."); };
window.addEventListener("focus", standPruefen);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) standPruefen(); });
async function schreibeDatei(){
  if(!datei || !dateiVerbunden) return;
  try{
    const w = await datei.createWritable();
    await w.write(JSON.stringify(S, null, 1));
    await w.close();
    dateiFehler = "";
  }catch(e){
    console.error(e); dateiFehler = "Speichern in der Datei hat nicht geklappt."; dateiVerbunden = false;
  }
  renderSpeicher();
}
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("sitzplaner",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }

async function leseDatei(h){
  const f = await h.getFile(); const t = await f.text();
  return t.trim() ? pruefe(JSON.parse(t)) : null;
}
// Abgleich: die neuere Fassung gewinnt
async function abgleichen(){
  const d = await leseDatei(datei);
  if(d && (!S.gespeichert || (d.gespeichert && d.gespeichert > S.gespeichert))){
    undo.push(JSON.stringify(S));          // mit „Rückgängig“ kommt man zum vorherigen Stand zurück
    S = d; localStorage.setItem(LS_KEY, JSON.stringify(S));
    toast("Neuerer Stand aus der Speicherdatei geladen. (Rückgängig holt den vorherigen zurück.)"); render();
  } else {
    await schreibeDatei();
  }
}
let verbindeLaeuft = false;
async function dateiVerbinden(){
  if(verbindeLaeuft || !datei || dateiVerbunden) return;
  verbindeLaeuft = true;
  try{
    // direkt fragen (der Browser erlaubt das nur unmittelbar nach einem Klick)
    const p = await datei.requestPermission({mode:"readwrite"});
    if(p!=="granted"){ toast("Kein Zugriff auf die Datei erlaubt – gespeichert wird vorerst nur im Browser."); return; }
    dateiVerbunden = true; dateiFehler = "";
    await abgleichen();
    toast("Speicherdatei verbunden – es wird wieder automatisch gespeichert.");
  }catch(e){ console.error(e); dateiFehler="Die Datei konnte nicht geöffnet werden (verschoben oder gelöscht?)."; dateiVerbunden=false; }
  finally{ verbindeLaeuft = false; renderSpeicher(); }
}
// Nach einem Browser-Neustart beim ersten Klick irgendwo im Programm von selbst nach der Erlaubnis fragen
let erlaubnisGefragt = false;
document.addEventListener("click", e=>{

/* ---------- Anzeige der Namen ---------- */
function anzeigeName(k, p, sid){
  const s = k.schueler.find(x=>x.id===sid); if(!s) return "";
  if(p.anzeige==="voll") return s.name;
  const vn = vorname(s.name), nn = nachname(s.name);
  if(p.anzeige==="vornameN") return vn===nn ? vn : `${vn} ${nn[0]}.`;
  // nur Vorname – bei doppelten Vornamen in der Klasse den Anfangsbuchstaben dazu
  const gleich = k.schueler.filter(x=>vorname(x.name)===vn).length > 1;
  return gleich && vn!==nn ? `${vn} ${nn[0]}.` : vn;
}

  const sicherungFaellig = S.klassen.length && (!letzte || tage>14);

  let stand = "", haupt = "", weitere = "";
  if(fsOk && datei && dateiVerbunden){
    stand = `<div class="st ok" title="Jede Änderung wird automatisch in ${esc(datei.name)} gespeichert">✓ Speichert in ${esc(datei.name)}</div>`;
    weitere = `<button data-a="datei-oeffnen">Andere Speicherdatei …</button>`;
  } else if(fsOk && datei){
    stand = `<div class="st warn" title="${esc(dateiFehler||"Nach einem Browser-Neustart muss das Schreiben in die Datei einmal erlaubt werden.")}">Speicherdatei nicht verbunden</div>`;
    haupt = `<button class="hl" data-a="datei-verbinden">Verbinden</button>`;
    weitere = `<button data-a="datei-oeffnen">Andere Datei öffnen …</button>`;
  } else if(fsOk){
    stand = `<div class="st warn">Nur im Browser gespeichert</div>`;
    haupt = `<button class="hl" data-a="datei-neu">Speicherdatei anlegen</button>`;
    weitere = `<button data-a="datei-oeffnen">Vorhandene Datei öffnen …</button>`;
  } else {
    stand = `<div class="st ${sicherungFaellig?"warn":""}">${letzte ? `Letzte Sicherung: ${datum(letzte)}` : (S.klassen.length ? "Noch keine Sicherung" : "")}</div>`;
    if(sicherungFaellig) haupt = sicherungsKnopf.replace("<button ", `<button class="hl" `);
  }
  if(!(haupt.includes("sicherung-"))) weitere += sicherungsKnopf;
  if(teilenOk && !weitere.includes("sicherung-runter")) weitere += `<button data-a="sicherung-runter">Sicherung herunterladen</button>`;
  weitere += `<button data-a="sicherung-laden">Sicherung laden …</button>`;
  $("#speicher").innerHTML = `${stand}${haupt}<details class="sich"><summary>Sicherung</summary>${weitere}</details>`;
}

function lageFuer(p){
  const L = LAYOUTS[p.typ];
  const nR = L.rows.length, nC = L.cols.length;
  if(!p.pultOben) return {L, cols:L.cols, rows:L.rows, seats:L.seats};
  // Pult oben = Blick von hinten: alles um 180° drehen
  return {L, cols:[...L.cols].reverse(), rows:[...L.rows].reverse(),
    seats: L.seats.map(s=>({id:s.id,row:nR-1-s.row,col:nC-1-s.col,bd:{t:s.bd.b,b:s.bd.t,l:s.bd.r,r:s.bd.l}}))};
}

function nachPlanRender(){
  zeigeSpeicherstand();
  const wrap = $("#sheetwrap"), sheet = $("#sheet"), sizer = $("#sheetsizer");
  if(!wrap || !sheet || !sizer) return;
  sheet.style.transform = "none";
  passeNamenAn(sheet);
  const w = sheet.offsetWidth, h = sheet.offsetHeight;
  const z = Math.min(1.25, (wrap.clientWidth-32) / w);
  sheet.style.transform = `scale(${z.toFixed(4)})`;
  sizer.style.width = (w*z)+"px"; sizer.style.height = (h*z)+"px";
}
// Schrift verkleinern, bis der Name in den Platz passt (max. 16 pt wie in der Vorlage)
function passeNamenAn(root){
  root.querySelectorAll(".seat .nm").forEach(el=>{
    const box = el.parentElement; let s = 16;
    el.style.fontSize = s+"pt";
    while(s>7 && (el.scrollWidth > box.clientWidth-6 || el.offsetHeight > box.clientHeight-4)){
      s -= 0.5; el.style.fontSize = s+"pt";
    }
  });
}
window.addEventListener("resize", ()=>{ if(view.name==="plan") nachPlanRender(); });
window.addEventListener("orientationchange", ()=>setTimeout(()=>{ if(view.name==="plan") nachPlanRender(); }, 300));
window.addEventListener("beforeprint", ()=>{ const sh=$("#sheet"); if(sh){ sh.style.transform="none"; passeNamenAn(sh); } });
window.addEventListener("afterprint", ()=>{ if(view.name==="plan") nachPlanRender(); });

/* ---------- Sitzplan-Aktionen ---------- */
function aktPlan(){ const k=K(view.klasseId); return [k, P(k,view.planId)]; }
function setzeAuf(platz, quelle){
  const [k,p] = aktPlan(); if(!p) return;
  const [typ,id] = quelle.split(":");
  aendern(()=>{
    if(typ==="schueler"){
      for(const [pl,sid] of Object.entries(p.sitze)) if(sid===id) delete p.sitze[pl];
      p.sitze[platz] = id;
    } else if(typ==="platz"){
      if(id===platz) return;
      const a = p.sitze[id], b = p.sitze[platz];
      if(a) p.sitze[platz]=a; else delete p.sitze[platz];
      if(b) p.sitze[id]=b; else delete p.sitze[id];
    }
    p.geaendert = jetzt();
  });
}
function leerePlatz(platz){
  const [,p] = aktPlan(); if(!p || !p.sitze[platz]) return;
  aendern(()=>{ delete p.sitze[platz]; p.geaendert=jetzt(); });
}
function zufall(alle){
  const [k,p] = aktPlan(); if(!p) return;
  if(alle && Object.keys(p.sitze).length && !confirm("Alle Schüler neu zufällig verteilen? (Mit „Rückgängig“ kommst du zurück.)")) return;
  aendern(()=>{
    if(alle) p.sitze = {};
    const sitzend = new Set(Object.values(p.sitze));
    const offen = shuffle(k.schueler.filter(s=>!sitzend.has(s.id)).map(s=>s.id));
    // Plätze von vorne (Pult) nach hinten auffüllen, innerhalb einer Reihe zufällig
    const order = plaetzeVonVorne(p).flatMap(b=>shuffle(b.filter(id=>!p.sitze[id])));
    offen.forEach((sid,i)=>{ if(order[i]) p.sitze[order[i]] = sid; });
    p.geaendert = jetzt();
    if(offen.length > order.length) setTimeout(()=>toast(`${offen.length-order.length} Schüler haben keinen Platz mehr bekommen.`),50);
  });
}

/* ---------- Freie Anordnung: Tische bearbeiten ---------- */
function objekte(p){
  return [...p.tische.map(t=>{ const [w,h]=tischGroesse(t); return {id:t.id, x:t.x, y:t.y, w, h, ref:t}; }),
          {id:"PULT", x:p.pult.x, y:p.pult.y, w:PULT_W, h:PULT_H, ref:p.pult}];
}
function freierPlatz(p, w, h){
  const obj = objekte(p);
  for(const rand of [4,1]){   // erst mit Abstand suchen, sonst auch knapp daneben
    const frei = (x,y) => obj.every(o => x+w+rand <= o.x || o.x+o.w+rand <= x || y+h+rand <= o.y || o.y+o.h+rand <= y);
    for(let y=rand; y<=FL_H-h; y+=2.5) for(let x=rand; x<=FL_W-w; x+=2.5) if(frei(x,y)) return [x,y];
  }
  return [4,4];
}
// Einzelplatz: geht bei jeder Vorlage. Feste Vorlagen werden dafür still in verschiebbare Tische umgewandelt.
function einzelplatz(){
  const [,p] = aktPlan(); if(!p) return;
  if(!istFrei(p)) umwandeln(true);
  freiModus = "anordnen"; sel = null;
  tischNeu("1");
  toast("Einzelplatz ist da – jetzt an die gewünschte Stelle ziehen, dann „Fertig“.");
}
function umwandeln(still){
  const [,p] = aktPlan(); if(!p || istFrei(p)) return;
  if(!still && !confirm("Diesen Sitzplan in einen frei verschiebbaren Plan umwandeln?\n\nDie Sitzordnung bleibt erhalten. Danach kannst du alle Tische mit der Maus verschieben, drehen, löschen und neue hinzufügen.")) return;
  aendern(()=>{
    const {tische, map} = vorlageZuTischen(p.typ);
    const neu = {};
    for(const [alt, sid] of Object.entries(p.sitze)) if(map[alt]) neu[map[alt]] = sid;
    if(p.typ==="physikraum" && !p.raum) p.raum = "Physikraum";
    p.typ = "frei"; p.tische = tische; p.pult = pultStart(); p.sitze = neu; p.pultOben = false; p.geaendert = jetzt();
  }, {ohneRender:true});
  freiModus = "anordnen"; selTische = new Set();
  if(still) return;
  render();
  toast("Jetzt kannst du die Tische verschieben.");
}
function tischNeu(art){
  const [,p] = aktPlan(); if(!p) return;
  const gruppe = art==="g4" ? 2 : art==="g6" ? 3 : 0;
  const n = gruppe || +art;
  const [x,y] = freierPlatz(p, n*SW, gruppe ? 2*SH : SH);
  const neu = gruppe
    ? [{id:tid(), x, y, n, richtung:"quer"}, {id:tid(), x, y:y+SH, n, richtung:"quer"}]
    : [{id:tid(), x, y, n, richtung:"quer"}];
  aendern(()=>{ p.tische.push(...neu); p.geaendert = jetzt(); }, {ohneRender:true});
  selTische = new Set(neu.map(t=>t.id)); renderMain();
}
const gewaehlteTische = p => p.tische.filter(t=>selTische.has(t.id));
function inFlaeche(o){ const [w,h] = o.richtung ? tischGroesse(o) : [PULT_W,PULT_H];
  o.x = +Math.min(Math.max(0,o.x), FL_W-w).toFixed(1); o.y = +Math.min(Math.max(0,o.y), FL_H-h).toFixed(1); }
function tischeDrehen(){
  const [,p] = aktPlan(); const ts = gewaehlteTische(p); if(!ts.length) return;
  aendern(()=>{ ts.forEach(t=>{ t.richtung = t.richtung==="laengs"?"quer":"laengs"; inFlaeche(t); }); p.geaendert=jetzt(); });
}
function tischeKopieren(){
  const [,p] = aktPlan(); const ts = gewaehlteTische(p); if(!ts.length) return;
  const neu = ts.map(t=>({...t, id:tid(), x:t.x+8, y:t.y+8}));
  neu.forEach(inFlaeche);
  aendern(()=>{ p.tische.push(...neu); p.geaendert=jetzt(); }, {ohneRender:true});
  selTische = new Set(neu.map(t=>t.id)); renderMain();
}
function tischeLoeschen(){
  const [,p] = aktPlan(); const ts = gewaehlteTische(p); if(!ts.length) return;
  const weg = new Set(ts.map(t=>t.id));
  const besetzt = ts.reduce((a,t)=>a+Array.from({length:t.n},(_,i)=>p.sitze[sitzId(t,i)]).filter(Boolean).length, 0);
  aendern(()=>{
    p.tische = p.tische.filter(t=>!weg.has(t.id));
    for(const pl of Object.keys(p.sitze)) if(weg.has(pl.split("-")[0])) delete p.sitze[pl];
    p.geaendert = jetzt();
  }, {ohneRender:true});
  selTische = new Set(); renderMain();
  if(besetzt) toast(`${besetzt} Schüler sind wieder ohne Platz. (Strg+Z macht es rückgängig.)`);
}
function tischeNeuBeginnen(art){
  const [,p] = aktPlan(); if(!p) return;
  if((p.tische.length || Object.keys(p.sitze).length) &&
     !confirm("Alle Tische durch die neue Anordnung ersetzen? Die Sitzordnung wird dabei geleert. (Strg+Z macht es rückgängig.)")) return;
  aendern(()=>{ p.tische = startTische(art); p.pult = pultStart(); p.sitze = {}; p.geaendert = jetzt(); }, {ohneRender:true});
  selTische = new Set(); renderMain();
}
function markiereAuswahl(){
  document.querySelectorAll("[data-tisch],[data-pult]").forEach(el=>
    el.classList.toggle("tsel", selTische.has(el.dataset.tisch || "PULT")));
}
// Einrasten: an Rändern anderer Tische, sonst auf ein 2,5-mm-Raster
function einrasten(p, ids, x, y, w, h){
  const andere = objekte(p).filter(o=>!ids.has(o.id));
  const T = 4;
  const ueberlapp = (a1,a2,b1,b2) => Math.min(a2,b2) - Math.max(a1,b1);   // < 0 = Lücke
  // Die beste Stelle auf einer Achse suchen (kleinste Abweichung + Strafpunkte)
  function achse(wert, laenge, kand){
    let best = null, score = Infinity;
    for(const [c, strafe] of kand){ const d = Math.abs(c-wert); if(d<T && d+strafe<score){ score = d+strafe; best = c; } }
    return best ?? Math.round(wert/2.5)*2.5;
  }
  // 1) Höhe: an Tische darüber/darunter anlegen, an Nachbarn daneben ausrichten
  const ky = [];
  for(const o of andere){
    const ov = ueberlapp(x, x+w, o.x, o.x+o.w);
    if(ov > 1){ ky.push([o.y+o.h,0],[o.y-h,0],[o.y,1],[o.y+o.h-h,1]); }
    else if(ov > -15){ ky.push([o.y,0.5],[o.y+o.h-h,0.5],[o.y+o.h,3],[o.y-h,3]); }
  }
  const ny = achse(y, h, ky);
  // 2) Seite (mit der neuen Höhe): in derselben Reihe anlegen, bei gestapelten Tischen bündig ausrichten
  const kx = [];
  for(const o of andere){
    const ov = ueberlapp(ny, ny+h, o.y, o.y+o.h);
    if(ov > 1){ kx.push([o.x+o.w,0],[o.x-w,0],[o.x,2],[o.x+o.w-w,2]); }
    else if(ov > -1){ kx.push([o.x,0],[o.x+o.w-w,0],[o.x+o.w,3],[o.x-w,3]); }
    else if(ov > -15){ kx.push([o.x,1],[o.x+o.w-w,1],[o.x+o.w,3],[o.x-w,3]); }
  }
  return [achse(x, w, kx), ny];
}

let zug = null;
document.addEventListener("pointerdown", e=>{
  if(view.name!=="plan" || freiModus!=="anordnen" || e.button!==0) return;
  const fl = $("#flaeche"); if(!fl || !fl.contains(e.target)) return;
  const [,p] = aktPlan(); if(!p || !istFrei(p)) return;
  const el = e.target.closest("[data-tisch],[data-pult]");
  if(!el){ selTische = new Set(); markiereAuswahl(); renderMain(); return; }
  e.preventDefault();
  const id = el.dataset.tisch || "PULT";
  const vorher = [...selTische].join();
  let abwaehlen = null;
  if(e.shiftKey || e.ctrlKey || mehrfach){
    // schon gewählt: erst beim Loslassen ohne Bewegung abwählen, damit man die Gruppe ziehen kann
    if(selTische.has(id)) abwaehlen = id; else selTische.add(id);
  }
  else if(!selTische.has(id)) selTische = new Set([id]);
  markiereAuswahl();
  const mmpx = FL_W / fl.getBoundingClientRect().width;
  const start = {};
  for(const o of objekte(p)) if(selTische.has(o.id)) start[o.id] = {x:o.x, y:o.y, w:o.w, h:o.h};
  zug = {sx:e.clientX, sy:e.clientY, mmpx, start, haupt:id, bewegt:false, dx:0, dy:0, auswahlNeu: vorher!==[...selTische].join(), pid:e.pointerId, abwaehlen};
  try{ el.setPointerCapture(e.pointerId); }catch{}
});
document.addEventListener("pointermove", e=>{
  if(!zug || e.pointerId!==zug.pid) return;
  const rx = (e.clientX-zug.sx)*zug.mmpx, ry = (e.clientY-zug.sy)*zug.mmpx;
  if(!zug.bewegt && Math.hypot(e.clientX-zug.sx, e.clientY-zug.sy) < 4) return;
  zug.bewegt = true;
  const [,p] = aktPlan(); const h0 = zug.start[zug.haupt];
  let [nx, ny] = einrasten(p, selTische, h0.x+rx, h0.y+ry, h0.w, h0.h);
  let dx = nx-h0.x, dy = ny-h0.y;
  // die ganze Auswahl muss auf der Fläche bleiben
  for(const s of Object.values(zug.start)){
    dx = Math.min(Math.max(dx, -s.x), FL_W-s.w-s.x);
    dy = Math.min(Math.max(dy, -s.y), FL_H-s.h-s.y);
  }
  zug.dx = dx; zug.dy = dy;
  for(const [id,s] of Object.entries(zug.start)){
    const el = id==="PULT" ? document.querySelector("[data-pult]") : document.querySelector(`[data-tisch="${id}"]`);
    if(el){ el.style.left = (s.x+dx)+"mm"; el.style.top = (s.y+dy)+"mm"; }
  }
});
document.addEventListener("pointerup", e=>{
  if(!zug || e.pointerId!==zug.pid) return;
  const z = zug; zug = null;
  const [,p] = aktPlan(); if(!p) return;
  if(z.bewegt && (z.dx || z.dy)){
    aendern(()=>{
      for(const o of objekte(p)) if(z.start[o.id]){
        o.ref.x = +(z.start[o.id].x + z.dx).toFixed(1);
        o.ref.y = +(z.start[o.id].y + z.dy).toFixed(1);
      }
      p.geaendert = jetzt();
    });
  } else {
    if(z.abwaehlen && !z.bewegt) selTische.delete(z.abwaehlen);
    renderMain();
  }
});
document.addEventListener("pointercancel", e=>{ if(zug && e.pointerId===zug.pid){ zug = null; renderMain(); } });
function verschiebeAuswahl(dx, dy){
  const [,p] = aktPlan(); if(!p) return;
  const os = objekte(p).filter(o=>selTische.has(o.id)); if(!os.length) return;
  for(const o of os){ dx = Math.min(Math.max(dx, -o.x), FL_W-o.w-o.x); dy = Math.min(Math.max(dy, -o.y), FL_H-o.h-o.y); }
  aendern(()=>{ os.forEach(o=>{ o.ref.x = +(o.x+dx).toFixed(1); o.ref.y = +(o.y+dy).toFixed(1); }); p.geaendert = jetzt(); });
}

/* ---------- Formulare & Eingabefelder ---------- */
function normName(n){
  n = n.replace(/^\s*\d+\s*[.)]?\s+/,"").trim();
  if(n.includes("\t")){ const [a,b] = n.split("\t").map(x=>x.trim()).filter(Boolean); if(a&&b) n = `${b} ${a}`; }
  else if(n.includes(",")){ const [a,b] = n.split(",").map(x=>x.trim()); if(a&&b) n = `${b} ${a}`; }
  return n.replace(/\s+/g," ").trim();
}
function schuelerDazu(k, namen){
  const da = new Set(k.schueler.map(s=>s.name.toLowerCase()));
  let neu=0, doppelt=0;
  aendern(()=>{
    for(const roh of namen){
      const n = normName(roh); if(!n) continue;
      if(da.has(n.toLowerCase())){ doppelt++; continue; }
      da.add(n.toLowerCase()); k.schueler.push({id:uid(), name:n}); neu++;
    }
  });
  toast(`${neu} Schüler hinzugefügt${doppelt?`, ${doppelt} doppelt (übersprungen)`:""}.`);
}

let namenZug = null;
function zielUnter(x, y){
  const el = document.elementFromPoint(x, y);

}
function namenZugEnde(){
  if(!namenZug) return;

document.addEventListener("pointermove", e=>{
  const z = namenZug; if(!z || e.pointerId!==z.pid) return;
  if(!z.aktiv){
    if(Math.hypot(e.clientX-z.sx, e.clientY-z.sy) < 8) return;

  }

  const ziel = zielUnter(e.clientX, e.clientY);

  if(ziel) ziel.classList.add("over");
}, {passive:false});

/* ============================================================
   Klassenliste einlesen: Foto, PDF, Word, Excel, CSV, Text
   Die Texterkennung läuft im Browser auf diesem Rechner.
   Aus dem Internet geladen wird nur das Erkennungsprogramm selbst,
   das Foto und die Namen verlassen den Rechner nicht.
   ============================================================ */
const CDN = {
  tesseract: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",
  pdfjs: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
  pdfjsWorker: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"
};
const skripte = {};
function ladeSkript(url){
  return skripte[url] ||= new Promise((res,rej)=>{
    const s = document.createElement("script"); s.src = url; s.onload = res;
    s.onerror = ()=>{ delete skripte[url]; s.remove(); rej(new Error("Ein Baustein konnte nicht aus dem Internet geladen werden. Bist du online? (Für Fotos und PDFs braucht das Programm einmal Internet.)")); };
    document.head.appendChild(s);
  });
}

let imp = null;

  imp = {klasseId:view.klasseId, zeilen:null, arbeitet:false, status:"", prozent:0, fehler:"", hinweis:"", vorschau:null, getauscht:false};
  renderImport();
}
function importSchliessen(){ imp = null; $("#modal").innerHTML = ""; }

      </div>
      ${imp.fehler?`<div class="imp-fehler">${esc(imp.fehler)}</div>`:""}`;
    fuss = `<button data-imp="schliessen">Abbrechen</button>`;
  } else {
    const da = new Set(k.schueler.map(s=>s.name.toLowerCase()));

      ${imp.vorschau?`<div class="imp-vorschau"><img src="${imp.vorschau}" alt=""></div>`:""}
      <div>
        ${imp.hinweis?`<div class="imp-hinweis">${esc(imp.hinweis)}</div>`:""}
        <p class="hint" style="margin-top:0">Bitte kurz prüfen: Tippfehler direkt im Feld verbessern, falsche Zeilen abhaken oder mit ✕ löschen.</p>

          const schon = da.has(z.name.trim().toLowerCase());

            <button data-imp="weg" data-i="${i}" title="Zeile löschen">✕</button></div>`;}).join("")}

        </div>
      </div></div>`;
    fuss = `<button class="primary" data-imp="uebernehmen" ${anz?"":"disabled"}>${anz} Schüler in Klasse ${esc(k.name)} übernehmen</button>
      <button data-imp="schliessen">Abbrechen</button>
      <span class="hint" style="margin-left:auto">${imp.zeilen.length} Zeilen erkannt</span>`;

  const b = e.target.closest("[data-imp]"); if(!b) return;
  const a = b.dataset.imp, i = +b.dataset.i;

  if(a==="plus"){ imp.zeilen.push({name:"",an:true}); renderImport(); const f=document.querySelectorAll("[data-imp-name]"); f[f.length-1]?.focus(); }

    imp.getauscht = !imp.getauscht;
    imp.zeilen.forEach(z=>z.name = tauscheName(z.name, imp.getauscht));
    imp.hinweis = ""; renderImport();
  }
  if(a==="uebernehmen"){
    const k = K(imp.klasseId);
    const namen = imp.zeilen.filter(z=>z.an && z.name.trim()).map(z=>z.name);

function tauscheName(n, vorwaerts){
  const w = n.trim().split(/\s+/); if(w.length<2) return n.trim();
  return vorwaerts ? [...w.slice(1), w[0]].join(" ") : [w[w.length-1], ...w.slice(0,-1)].join(" ");
}

/* Datei einlesen */
async function importDatei(file){
  imp.arbeitet = true; imp.fehler = ""; imp.hinweis = ""; imp.prozent = 0; imp.vorschau = null; imp.getauscht = false;
  imp.status = "Datei wird gelesen …"; renderImport();
  try{
    const n = file.name.toLowerCase();
    let zeilen;
    if(file.type.startsWith("image/") || /\.(jpe?g|png|webp|bmp|gif|heic|heif)$/.test(n)) zeilen = await ausBild(file);
    else if(n.endsWith(".pdf")) zeilen = await ausPdf(file);
    else if(n.endsWith(".docx")) zeilen = await ausDocx(file);
    else if(n.endsWith(".xlsx")) zeilen = await ausXlsx(file);
    else if(/\.(csv|tsv|txt)$/.test(n) || file.type.startsWith("text/")) zeilen = (await leseText(file)).split(/\r?\n/);
    else if(/\.(doc|xls)$/.test(n)) throw new Error("Alte Word-/Excel-Dateien (.doc, .xls) kann ich nicht lesen. Bitte in Word bzw. Excel als .docx oder .xlsx speichern – oder als PDF.");
    else throw new Error("Dieses Dateiformat kenne ich nicht. Möglich sind: Foto (JPG, PNG), PDF, Word (.docx), Excel (.xlsx), CSV oder Text.");
    const {namen, getauscht, sitzplan} = namenAusZeilen(zeilen);
    if(!namen.length) throw new Error("Ich habe in der Datei keine Namen gefunden. Bei Fotos: bitte schärfer, gerader und mit mehr Licht fotografieren.");
    const k = K(imp.klasseId);
    const da = new Set(k.schueler.map(s=>s.name.toLowerCase()));
    imp.zeilen = namen.map(nm=>({name:nm, an:!da.has(nm.toLowerCase())}));
    imp.getauscht = getauscht;
    if(getauscht) imp.hinweis = "In der Liste stand der Nachname vorne. Ich habe das schon umgedreht (Vorname Nachname). Falls das nicht stimmt: „⇄ Vor- und Nachname tauschen“.";
    if(sitzplan) imp.hinweis = "Das sieht aus wie ein Sitzplan: Jeder Platz wurde als eigener Name übernommen. Fehlen Nachnamen, kannst du sie hier direkt ergänzen.";
  }catch(e){
    console.error(e); imp.zeilen = null; imp.fehler = e.message || String(e);
  }
  imp.arbeitet = false;
  renderImport();
}

async function leseText(file){
  const buf = await file.arrayBuffer();
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }
  catch{ return new TextDecoder("windows-1252").decode(buf); }
}

/* Fotos: Bild aufbereiten und Text erkennen */
async function bildAufbereiten(quelle){
  const bmp = quelle instanceof HTMLCanvasElement ? quelle : await createImageBitmap(quelle);
  const lang = Math.max(bmp.width, bmp.height);
  const f = lang > 2600 ? 2600/lang : lang < 1400 ? 1400/lang : 1;
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width*f); c.height = Math.round(bmp.height*f);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
  // Helle Schrift auf dunklem Grund (z. B. Tafelbild, dunkle Folie)? Dann Farben umdrehen.
  const dunkel = mittlereHelligkeit(bmp) < 120;
  ctx.filter = dunkel ? "grayscale(1) invert(1) contrast(1.3)" : "grayscale(1) contrast(1.35)";
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  ctx.filter = "none";
  linienEntfernen(c);
  return c;
}
// Lange gerade Linien (Tischrahmen, Tabellenlinien) weiß übermalen – sie stören die Texterkennung.
// Buchstaben bleiben stehen, weil ihre Striche viel kürzer sind.
function linienEntfernen(c){
  const ctx = c.getContext("2d"), W = c.width, H = c.height;
  const bild = ctx.getImageData(0, 0, W, H), d = bild.data;
  const dunkel = new Uint8Array(W*H);
  for(let i=0, p=0; i<d.length; i+=4, p++) dunkel[p] = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) < 140 ? 1 : 0;
  const weg = new Uint8Array(W*H);
  const minLauf = Math.max(40, Math.round(Math.min(W, H) * 0.06));
  for(let y=0; y<H; y++){                    // waagerechte Linien
    let start = -1;
    for(let x=0; x<=W; x++){
      const an = x<W && dunkel[y*W+x];
      if(an && start<0) start = x;
      if(!an && start>=0){ if(x-start >= minLauf) for(let k=start; k<x; k++) weg[y*W+k] = 1; start = -1; }
    }
  }
  for(let x=0; x<W; x++){                    // senkrechte Linien
    let start = -1;
    for(let y=0; y<=H; y++){
      const an = y<H && dunkel[y*W+x];
      if(an && start<0) start = y;
      if(!an && start>=0){ if(y-start >= minLauf) for(let k=start; k<y; k++) weg[k*W+x] = 1; start = -1; }
    }
  }
  for(let p=0; p<W*H; p++) if(weg[p]){ const i = p*4; d[i] = d[i+1] = d[i+2] = 255; }
  ctx.putImageData(bild, 0, 0);
}
function mittlereHelligkeit(bild){
  const k = document.createElement("canvas"); k.width = 64; k.height = 64;
  const x = k.getContext("2d"); x.drawImage(bild, 0, 0, 64, 64);
  const d = x.getImageData(0, 0, 64, 64).data; let s = 0;
  for(let i=0;i<d.length;i+=4) s += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  return s / (d.length/4);
}
// Texterkennung → Textzeilen. Wörter, die weit auseinander stehen (andere Spalte / anderer Tisch),
// werden durch einen Tabulator getrennt, damit sie später nicht zu einem Namen zusammenwachsen.
async function texterkennung(canvas, teil){
  imp.status = "Texterkennung wird geladen (beim ersten Mal 10–30 Sekunden) …"; zeigeFortschritt();
  await ladeSkript(CDN.tesseract);
  const worker = await Tesseract.createWorker("deu", 1, {
    logger: m=>{
      if(m.status==="recognizing text"){ imp.status = `Text wird erkannt${teil?" ("+teil+")":""} …`; imp.prozent = Math.round(m.progress*100); }
      else if(m.status){ imp.status = "Texterkennung wird vorbereitet …"; imp.prozent = Math.round((m.progress||0)*100); }
      zeigeFortschritt();
    }
  });
  try{
    // „Verstreuter Text“: findet Namen auch in Tabellen und Sitzplänen mit Linien
    await worker.setParameters({tessedit_pageseg_mode: "11"});
    const {data} = await worker.recognize(canvas, {}, {text:true, blocks:true});
    const woerter = [];
    for(const b of data.blocks||[]) for(const p of b.paragraphs||[]) for(const l of p.lines||[]) for(const w of l.words||[]){
      const t = (w.text||"").trim();
      if(/[A-Za-zÀ-ÖØ-öø-ÿĀ-ž]{2,}/.test(t)) woerter.push({t, x0:w.bbox.x0, x1:w.bbox.x1, y0:w.bbox.y0, y1:w.bbox.y1});
    }
    return woerter.length ? woerterZuZeilen(woerter) : (data.text||"").split(/\r?\n/);
  }
  finally{ await worker.terminate(); }
}
function woerterZuZeilen(ws){
  const hs = ws.map(w=>w.y1-w.y0).sort((a,b)=>a-b);
  const h = hs[Math.floor(hs.length/2)] || 20;
  const reihen = [];
  for(const w of [...ws].sort((a,b)=>(a.y0+a.y1)-(b.y0+b.y1))){
    const cy = (w.y0+w.y1)/2;
    let r = reihen.find(r=>Math.abs(r.cy-cy) < h*0.6);
    if(!r){ r = {cy, ws:[]}; reihen.push(r); }
    r.ws.push(w);
    r.cy = r.ws.reduce((a,x)=>a+(x.y0+x.y1)/2, 0) / r.ws.length;
  }
  return reihen.sort((a,b)=>a.cy-b.cy).map(r=>{
    r.ws.sort((a,b)=>a.x0-b.x0);
    let s = "", ende = null;
    for(const w of r.ws){ if(ende!==null) s += (w.x0-ende > h*1.0) ? "\t" : " "; s += w.t; ende = w.x1; }
    return s;
  });
}
async function ausBild(file){
  let c;
  try{ c = await bildAufbereiten(file); }
  catch{
    const heic = /\.(heic|heif)$/i.test(file.name) || /hei[cf]/.test(file.type);
    throw new Error(heic
      ? "Fotos im iPhone-Format HEIC kann dieser Browser nicht öffnen. Auf dem iPad geht es direkt. Am Rechner: Foto als JPG schicken (z. B. per Mail oder OneDrive) oder am iPhone unter Einstellungen › Kamera › Formate „Maximale Kompatibilität“ wählen."
      : "Das Bild konnte nicht geöffnet werden.");
  }
  // Vorschau im Original (nicht das aufbereitete Graubild), damit man gut vergleichen kann
  imp.vorschau = URL.createObjectURL(file); renderImport();
  return await texterkennung(c);
}

/* PDF: Text auslesen, bei eingescannten PDFs Texterkennung */
async function ausPdf(file){
  imp.status = "PDF wird geöffnet …"; zeigeFortschritt();
  await ladeSkript(CDN.pdfjs);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = CDN.pdfjsWorker;
  const pdf = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const seiteBild = async (nr, scale)=>{
    const page = await pdf.getPage(nr); const vp = page.getViewport({scale});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx, viewport:vp}).promise; return c;
  };
  let zeilen = [];
  for(let i=1;i<=pdf.numPages;i++){
    const tc = await (await pdf.getPage(i)).getTextContent();
    zeilen.push(...pdfZeilen(tc.items));
  }
  // Vorschau der ersten Seite – darf das Einlesen nie aufhalten
  const mitFrist = (pr, ms) => Promise.race([pr, new Promise((_,rej)=>setTimeout(()=>rej(new Error("Zeit abgelaufen")), ms))]);
  try{ imp.vorschau = (await mitFrist(seiteBild(1, 1.4), 8000)).toDataURL("image/jpeg", .85); renderImport(); }catch(e){ console.warn("Keine PDF-Vorschau:", e); }
  if(zeilen.join("").replace(/\s/g,"").length < 15){
    // eingescanntes PDF ohne Text → Seiten als Bild erkennen (höchstens 4 Seiten)
    zeilen = [];
    const n = Math.min(pdf.numPages, 4);
    for(let i=1;i<=n;i++){
      imp.status = "Eingescanntes PDF – Seite wird als Bild vorbereitet …"; zeigeFortschritt();
      const c = await bildAufbereiten(await mitFrist(seiteBild(i, 2.5), 30000));
      zeilen.push(...(await texterkennung(c, n>1?`Seite ${i} von ${n}`:"")));
    }
  }
  return zeilen;
}
function pdfZeilen(items){
  const reihen = [];
  for(const it of items){
    if(!it.str || !it.str.trim()) continue;
    const x = it.transform[4], y = it.transform[5];
    let r = reihen.find(r=>Math.abs(r.y-y) < 3);
    if(!r){ r = {y, teile:[]}; reihen.push(r); }
    r.teile.push({x, s:it.str, w:it.width||0});
  }
  reihen.sort((a,b)=>b.y-a.y);
  return reihen.map(r=>{
    r.teile.sort((a,b)=>a.x-b.x);
    let out = "", ende = null;
    for(const t of r.teile){
      if(ende!==null){ const luecke = t.x-ende; if(luecke > 12) out += "\t"; else if(luecke > 1 && !/\s$/.test(out) && !/^\s/.test(t.s)) out += " "; }
      out += t.s; ende = t.x + t.w;
    }
    return out;
  });
}

/* Word und Excel (.docx / .xlsx sind ZIP-Archive) */
async function zipOeffnen(file){
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
  let e = -1;
  for(let i=buf.length-22; i>=Math.max(0, buf.length-65558); i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) throw new Error("Die Datei ist beschädigt oder keine echte Word-/Excel-Datei.");
  const anzahl = dv.getUint16(e+10,true); let p = dv.getUint32(e+16,true); const dateien = {};
  for(let i=0;i<anzahl;i++){
    const methode = dv.getUint16(p+10,true), groesse = dv.getUint32(p+20,true);
    const nl = dv.getUint16(p+28,true), xl = dv.getUint16(p+30,true), kl = dv.getUint16(p+32,true), off = dv.getUint32(p+42,true);
    dateien[new TextDecoder().decode(buf.subarray(p+46, p+46+nl))] = {methode, groesse, off};
    p += 46+nl+xl+kl;
  }
  return async name=>{
    const f = dateien[name]; if(!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off+26,true) + dv.getUint16(f.off+28,true);
    const daten = buf.subarray(start, start+f.groesse);
    if(f.methode===0) return new TextDecoder().decode(daten);
    const strom = new Blob([daten]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new TextDecoder().decode(await new Response(strom).arrayBuffer());
  };
}
const xmlDoc = t => new DOMParser().parseFromString(t, "application/xml");
async function ausDocx(file){
  const hole = await zipOeffnen(file);
  const xml = await hole("word/document.xml");
  if(!xml) throw new Error("In dieser Word-Datei habe ich keinen Text gefunden.");
  const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const doc = xmlDoc(xml), zeilen = [];
  const text = el => [...el.getElementsByTagNameNS(W,"t")].map(t=>t.textContent).join("");
  const kinder = (el,name) => [...el.children].filter(c=>c.localName===name);
  (function lauf(el){
    for(const c of el.children){
      if(c.localName==="tbl"){
        for(const tr of kinder(c,"tr")) zeilen.push(kinder(tr,"tc").map(tc=>[...tc.getElementsByTagNameNS(W,"p")].map(text).join(" ").trim()).join("\t"));
      } else if(c.localName==="p") zeilen.push(text(c));
      else if(c.localName==="sdt" || c.localName==="sdtContent") lauf(c);
    }
  })(doc.getElementsByTagNameNS(W,"body")[0]);
  return zeilen;
}
async function ausXlsx(file){
  const hole = await zipOeffnen(file);
  const ss = await hole("xl/sharedStrings.xml");
  const texte = ss ? [...xmlDoc(ss).getElementsByTagName("si")].map(si=>[...si.getElementsByTagName("t")].map(t=>t.textContent).join("")) : [];
  const blatt = await hole("xl/worksheets/sheet1.xml");
  if(!blatt) throw new Error("In dieser Excel-Datei habe ich keine Tabelle gefunden.");
  const spalte = ref => { let n=0; for(const ch of (ref.match(/^[A-Z]+/)||["A"])[0]) n = n*26 + ch.charCodeAt(0)-64; return n-1; };
  return [...xmlDoc(blatt).getElementsByTagName("row")].map(row=>{
    const zellen = [];
    for(const c of row.getElementsByTagName("c")){
      const t = c.getAttribute("t"), v = c.getElementsByTagName("v")[0]?.textContent ?? "";
      const wert = t==="s" ? (texte[+v]??"") : t==="inlineStr" ? [...c.getElementsByTagName("t")].map(x=>x.textContent).join("") : v;
      zellen[spalte(c.getAttribute("r")||"A")] = wert;
    }
    return [...zellen].map(z=>z??"").join("\t");
  });
}

/* Aus Textzeilen die Namen heraussuchen */
const KOPF = new Set(("klasse klassenliste liste schuljahr seite name namen vorname vornamen nachname nachnamen familienname rufname "+
  "geburtsdatum geb geboren datum nr nummer lfd schüler schülerin schülerinnen schueler klassenlehrer klassenlehrerin klassenleitung "+
  "lehrer lehrerin telefon tel anschrift adresse straße strasse plz wohnort email e-mail unterschrift bemerkung bemerkungen religion "+
  "konfession geschlecht summe anzahl gesamt stand realschule gymnasium gesamtschule grundschule schule kurs fach note noten stundenplan").split(" "));
const PARTIKEL = new Set("von van der den de del della da di du dos el al la le ter ten zu bin ibn y".split(" "));
function namenAusZeilen(zeilen){
  const ergebnis = []; let nachnameZuerst = null, komma = 0;
  const saeubere = c => c
    .replace(/\S+@\S+/g," ")
    .replace(/\b\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4}\b/g," ")
    .replace(/\d+/g," ")
    .replace(/[^A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ'’\-, ]/g," ")
    .replace(/\s+/g," ").trim();
  const istWort = w => (/^[A-ZÀ-ÖØ-ÞĀ-ŽḀ-Ỿ]/.test(w) && w.replace(/[^A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]/g,"").length>=2) || PARTIKEL.has(w);
  const schoen = w => (w.length>2 && w===w.toUpperCase()) ? w.split("-").map(t=>t.charAt(0)+t.slice(1).toLowerCase()).join("-") : w;
  const zerlege = roh => roh.replace(/[;|]/g,"\t").replace(/ {2,}/g,"\t").split("\t").map(saeubere).filter(Boolean);
  const namensZellenVon = zellen => zellen.map(z=>z.replace(/,/g," ").split(" ").filter(istWort).join(" ")).filter(Boolean);
  const istKopf = zellen => zellen.join(" ").toLowerCase().split(/[\s,]+/).some(w=>KOPF.has(w));

  // Vorab: Ist das ein Sitzplan (viele Namen nebeneinander in einer Zeile) statt einer Liste?
  let kopfDa = false; const anzahlen = [];
  for(const roh of zeilen){
    if(!roh || !roh.trim()) continue;
    const z = zerlege(roh); if(!z.length) continue;
    if(istKopf(z)){ kopfDa = true; continue; }
    const n = namensZellenVon(z).length; if(n) anzahlen.push(n);
  }
  const ab4 = anzahlen.filter(n=>n>=4).length, ab3 = anzahlen.filter(n=>n>=3).length;
  const sitzplan = !kopfDa && (ab4 >= 2 || (ab3 >= 2 && new Set(anzahlen).size > 1));

  for(const roh of zeilen){
    if(!roh || !roh.trim()) continue;
    const zellen = zerlege(roh);
    if(!zellen.length) continue;
    const woerter = zellen.join(" ").toLowerCase().split(/[\s,]+/);
    if(woerter.some(w=>KOPF.has(w))){
      // Kopfzeile: Reihenfolge der Spalten merken
      const iv = woerter.findIndex(w=>w.startsWith("vorname")||w==="rufname");
      const inn = woerter.findIndex(w=>w.startsWith("nachname")||w==="familienname"||w==="name");
      if(iv>=0 && inn>=0) nachnameZuerst = inn < iv;
      continue;
    }
    if(sitzplan){
      // Sitzplan: jeder Platz (jede Zelle) ist ein eigener Name – oft nur Vornamen
      for(const z of namensZellenVon(zellen)){
        const w = z.split(/\s+/).map(schoen);
        if(w.length>=1 && w.length<=4 && !w.every(x=>PARTIKEL.has(x))) ergebnis.push({name:w.join(" "), offen:false});
      }
      continue;
    }
    let name = null;
    const mitKomma = zellen.find(z=>/[A-Za-zÀ-ž]\s*,\s*[A-Za-zÀ-ž]/.test(z));
    if(mitKomma){
      const [a,b] = mitKomma.split(",").map(s=>s.trim());
      name = `${b} ${a}`; komma++;
    } else {
      const namensZellen = zellen.map(z=>z.replace(/,/g," ").split(" ").filter(istWort).join(" ")).filter(Boolean);
      if(!namensZellen.length) continue;
      // zwei Spalten (z. B. Nachname | Vorname) → als Spalten merken, damit „von Berg“ zusammenbleibt
      const sp = namensZellen.slice(0,2).map(z=>z.split(/\s+/).map(schoen).join(" "));
      if(sp.length===2){
        if(nachnameZuerst===true) name = `${sp[1]} ${sp[0]}`;
        else if(nachnameZuerst===null) name = {n:`${sp[0]} ${sp[1]}`, offen:true, spalten:sp};
        else name = `${sp[0]} ${sp[1]}`;
      } else {
        if(nachnameZuerst===true) name = tauscheName(sp[0], true);
        else if(nachnameZuerst===null) name = {n:sp[0], offen:true};
        else name = sp[0];
      }
    }
    const text = typeof name==="string" ? name : name.n;
    const w = text.split(/\s+/).filter(x=>istWort(x)).map(schoen);
    if(w.length<1 || w.length>5 || w.every(x=>PARTIKEL.has(x))) continue;
    ergebnis.push({name:w.join(" "), offen: typeof name!=="string", spalten: name.spalten});
  }
  // Steht der Nachname vorne? Erkennbar daran, dass die Liste nach dem ersten Wort sortiert ist
  let getauscht = false;
  const offen = ergebnis.filter(e=>e.offen && e.name.includes(" "));
  const dreh = e => e.name = e.spalten ? `${e.spalten[1]} ${e.spalten[0]}` : tauscheName(e.name, true);
  const vorne = e => e.spalten ? e.spalten[0] : e.name.split(" ")[0];
  const hinten = e => e.spalten ? e.spalten[1] : nachname(e.name);
  if(nachnameZuerst===true){ offen.forEach(dreh); getauscht = true; }
  else if(nachnameZuerst===null && offen.length>=4){
    const sortiert = arr => { let ok=0; for(let i=1;i<arr.length;i++) if(arr[i-1].localeCompare(arr[i],"de")<=0) ok++; return ok/(arr.length-1); };
    const v = sortiert(offen.map(vorne)), h = sortiert(offen.map(hinten));
    if(v > 0.8 && v > h + 0.15){ offen.forEach(dreh); getauscht = true; }
  }
  // Doppelte entfernen; einzelne Wörter nur, wenn es sonst kaum etwas gibt
  const voll = ergebnis.filter(e=>e.name.includes(" "));
  const liste = (sitzplan || voll.length < Math.max(2, ergebnis.length/3) ? ergebnis : voll).map(e=>e.name);
  const gesehen = new Set();
  return {namen: liste.filter(n=>{ const k=n.toLowerCase(); if(gesehen.has(k)) return false; gesehen.add(k); return true; }), getauscht, sitzplan};
}

/* ---------- Tastatur ---------- */
document.addEventListener("keydown", e=>{
  const imFeld = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !imFeld){ e.preventDefault(); rueckgaengig(); }
  if(e.key==="Escape" && imp && !imp.arbeitet){ importSchliessen(); return; }
  if(view.name==="plan" && freiModus==="anordnen" && !imFeld && !imp && selTische.size){
    const schritt = e.shiftKey ? 5 : 1;
    const pfeil = {ArrowLeft:[-schritt,0], ArrowRight:[schritt,0], ArrowUp:[0,-schritt], ArrowDown:[0,schritt]}[e.key];
    if(pfeil){ e.preventDefault(); verschiebeAuswahl(...pfeil); return; }
    if(e.key==="r" || e.key==="R"){ e.preventDefault(); tischeDrehen(); return; }
    if(e.key==="Delete" || e.key==="Backspace"){ e.preventDefault(); tischeLoeschen(); return; }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="d"){ e.preventDefault(); tischeKopieren(); return; }
    if(e.key==="Escape"){ selTische = new Set(); renderMain(); return; }
  }
  if(e.key==="Escape" && sel){ sel=null; renderMain(); }
  if((e.key==="Delete"||e.key==="Backspace") && !imFeld && sel && sel.typ==="platz"){ const pl=sel.id; sel=null; leerePlatz(pl); }
});
